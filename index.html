:root {
  color-scheme: light;
  --wood: #2a1d14;      /* 목록함 나무 */
  --brass: #b98a3e;     /* 서랍 손잡이 놋쇠 */
  --room: #e9ece7;      /* 열람실 벽 */
  --paper: #fffef9;     /* 목록카드 */
  --ink: #1f2630;
  --pencil: #6b7079;
  --rule-red: #e0807a;  /* 목록카드 머리줄 */
  --rule-blue: #d7e3ee; /* 목록카드 괘선 */
  --stamp-ok: #3443a6;  --stamp-warn: #95650f;  --stamp-no: #b3261e;
  --serif: "Nanum Myeongjo", "Batang", serif;
  --classic: "Museum Classic", "Nanum Myeongjo", "Batang", serif;
  --sans: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--room); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }

/* 머리: 카드목록함 사진 */
.hero { position: relative; min-height: 300px; display: flex; align-items: flex-end; color: var(--paper);
  background: var(--wood) url("https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Card_catalogue_drawers.jpg/1920px-Card_catalogue_drawers.jpg") center 40% / cover no-repeat; }
.hero::before { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(42,29,20,.15) 0%, rgba(42,29,20,.55) 55%, rgba(42,29,20,.92) 100%); }
.hero-in { position: relative; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px 76px; }
h1 { margin: 0; font-family: var(--classic); font-weight: 700; font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -0.02em; }
.hero p { margin: 12px 0 0; max-width: 34em; font-size: 16px; color: rgba(255,254,249,.86); }
.credit { font-size: 12px; color: var(--pencil); padding-top: 8px; }
.credit a { color: inherit; }

main { max-width: 760px; margin: -52px auto 0; padding: 0 20px 72px; position: relative; display: grid; gap: 28px; }

/* 목록카드 공통 모양: 머리 빨간 줄 + 아래 가운데 구멍 */
.card { position: relative; background: var(--paper); border-radius: 3px;
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 10px 26px -12px rgba(42,29,20,.35); }
.card::after { content: ""; position: absolute; left: 50%; bottom: 10px; width: 12px; height: 12px; margin-left: -6px;
  border-radius: 50%; background: var(--room); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }

/* 입력 카드: 괘선 위에 쓰기 */
.entry { padding: 18px 22px 34px; }
.entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding-bottom: 8px;
  border-bottom: 2px solid var(--rule-red); }
.entry label { font-family: var(--classic); font-weight: 700; font-size: 16px; }
.rules { font-size: 13.5px; color: var(--pencil); }
textarea { display: block; width: 100%; min-height: 160px; margin: 0; padding: 0 2px; border: 0; outline: 0; resize: vertical;
  font: 500 18px/32px var(--sans); color: var(--ink); background-color: transparent;
  background-image: linear-gradient(transparent 31px, var(--rule-blue) 31px); background-size: 100% 32px; background-attachment: local; }
textarea::placeholder { color: #b4b7bb; }
.controls { display: flex; justify-content: flex-end; }
kbd { font: 700 11.5px var(--sans); color: var(--ink); background: var(--paper); border: 1px solid #c9ccc6;
  border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
button#go { font: 700 16px var(--sans); padding: 12px 28px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--wood); color: var(--paper); box-shadow: inset 0 -2px 0 var(--brass); }
button#go:hover { background: #3a2a1e; }
button#go:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
#status { font-size: 14px; color: var(--pencil); min-height: 1.6em; margin-top: -16px; }

/* 결과 카드 */
#out { display: grid; gap: 18px; }
.result { padding: 18px 22px 36px; display: grid; gap: 4px; min-width: 0; }
.result h2 { margin: 0 120px 6px 0; padding-bottom: 8px; border-bottom: 2px solid var(--rule-red);
  font-family: var(--serif); font-weight: 800; font-size: 21px; line-height: 1.35; overflow-wrap: anywhere; }
.result.pending h2 { color: var(--pencil); }
.books { list-style: none; margin: 0; padding: 0; }
.books li { padding: 8px 0 7px; border-bottom: 1px solid var(--rule-blue); min-width: 0; }
.bt { font-family: var(--serif); font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.books li:not(.exact) .bt { color: var(--pencil); }
.bm { font-size: 13.5px; color: var(--pencil); display: flex; flex-wrap: wrap; gap: 2px 14px; overflow-wrap: anywhere; }
.isbn { font-variant-numeric: tabular-nums; }
/* 나이스에 붙여넣을 글자 그대로 보여 주는 복사 쪽지 */
.neis { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; max-width: 100%; margin-top: 7px;
  padding: 6px 12px; text-align: left; cursor: copy; font: 600 15px var(--sans); color: var(--ink); overflow-wrap: anywhere;
  background: #fff; border: 1px solid #c9ccc6; border-bottom-width: 2px; border-radius: 4px; }
.neis:hover { border-color: var(--stamp-ok); }
.neis .tag { font-size: 12.5px; font-weight: 700; color: var(--stamp-ok); white-space: nowrap; }
.neis.copied { border-color: var(--stamp-ok); background: #f1f3fb; }
.go-site { justify-self: start; margin-top: 8px; font-size: 14px; color: var(--ink); }
.how { margin: -2px 0 2px; font-size: 13.5px; color: var(--stamp-ok); }
.empty { margin: 4px 0 0; color: var(--pencil); font-size: 14.5px; }

/* 고무도장 */
.stamp { position: absolute; top: 14px; right: 18px; transform: rotate(-9deg);
  font: 700 20px/1 var(--classic); padding: 8px 12px 7px; border: 3px double currentColor; border-radius: 6px;
  opacity: .88; mix-blend-mode: multiply; white-space: nowrap; }
.stamp small { display: block; font: 700 11px var(--sans); margin-top: 3px; text-align: center; }
.stamp.ok { color: var(--stamp-ok); } .stamp.warn { color: var(--stamp-warn); } .stamp.no { color: var(--stamp-no); }
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: thunk .28s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes thunk { from { opacity: 0; transform: rotate(-14deg) scale(1.6); } }
}
.wait { position: absolute; top: 20px; right: 22px; font-size: 14px; color: var(--pencil); }

@media (max-width: 520px) {
  .result h2 { margin-right: 0; margin-top: 46px; }
  .stamp { top: 12px; left: 18px; right: auto; }
  .wait { top: 18px; left: 22px; right: auto; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <h1>독후감 확인</h1>
    <p>아이들이 읽은 책 제목을 적으면 국립중앙도서관 ISBN 목록에서 찾아 드려요.</p>
  </div>
</header>

<main>
  <div class="card entry">
    <div class="entry-head">
      <label for="q">찾을 책</label>
      <span class="rules">(<kbd>Enter</kbd> 바로 찾기, <kbd>Shift</kbd>+<kbd>Enter</kbd> 한 권 더 적기, 저자나 출판사는 제목 뒤에 한 칸 띄어 적기)</span>
    </div>
    <textarea id="q" placeholder="아몬드 손원평&#10;어린왕자 생텍쥐페리&#10;완득이 창비" autofocus></textarea>
  </div>
  <div class="controls">
    <button id="go">찾기</button>
  </div>
  <div id="status" aria-live="polite"></div>
  <section id="out"></section>
  <footer class="credit">머리 사진: Carolina Prysyazhnyuk, <a href="https://commons.wikimedia.org/wiki/File:Card_catalogue_drawers.jpg" target="_blank" rel="noopener">위키미디어 공용</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noopener">CC BY-SA 2.0</a>. 검색 자료는 국립중앙도서관 ISBN 서지정보에서 가져와요.</footer>
</main>

<script>
const SEARCH = "https://www.nl.go.kr/seoji/contents/S80100000000.do?schType=simple&schFld=title&pageUnit=100&schStr=";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 검색은 구글 앱스 스크립트가 대신 함. 앱스 스크립트 안에서 열리면 google.script.run, 깃허브 페이지에서는 주소로 부름.
const API = "https://script.google.com/macros/s/AKfycbxDrxTmYG9_sHl-eezOzghHlPJAid3F8bsRixGYKyLyJB0Me-W8nkcgEEuTAL-LnLZZJQ/exec";
const lookup = line => window.google?.script?.run
  ? new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail).search(line))
  : fetch(API + "?q=" + encodeURIComponent(line))
      .then(r => r.json(), () => { throw new Error("검색 서버에 연결하지 못했어요. 잠시 뒤 다시 눌러 주세요."); })
      .catch(e => { throw e instanceof SyntaxError ? new Error("검색 서버가 응답하지 않아요. 앱스 스크립트 배포를 확인해 주세요.") : e; })
      .then(d => { if (d.error) throw new Error(d.error); return d; });

// r = 서버 결과: exact(제목이 딱 맞는 책), items(검색된 전체), title/author(서버가 나눠 본 제목·저자)
function render(card, q, r) {
  const exact = r.exact;
  const shown = (exact.length ? exact : r.items).slice(0, 5);
  const how = !exact.length || !r.extra ? ""
    : r.extraMatched ? `<p class="how">제목 ‘${esc(r.title)}’에 ‘${esc(r.extra)}’까지 맞는 책을 찾았어요.</p>`
    : `<p class="how">제목 ‘${esc(r.title)}’(으)로 찾았어요. ‘${esc(r.extra)}’는 저자나 출판사 표기와 달라 맞춰 보지 못했어요.</p>`;
  const stamp = exact.length ? `<div class="stamp ok">등록됨<small>${exact.length}권 일치</small></div>`
    : r.total ? `<div class="stamp warn">확인 필요<small>비슷한 제목만</small></div>`
    : `<div class="stamp no">없음<small>검색 결과 0건</small></div>`;
  const list = shown.length ? `<ul class="books">${shown.map(b => `<li class="${exact.length ? "exact" : ""}">
      <div class="bt">${esc(b.title)}</div>
      <div class="bm"><span>${esc(b.author)}</span><span>${esc(b.publisher)}</span><span>${esc(b.kind)}</span>
      <span class="isbn">${b.isbn ? "ISBN " + esc(b.isbn) : "ISBN 없음"}</span></div>
      <button class="neis" data-copy="${esc(b.neis)}"><span class="txt">${esc(b.neis)}</span><span class="tag">나이스용 복사</span></button></li>`).join("")}</ul>`
    : `<p class="empty">제목에 오타가 없는지 확인해 보세요. 띄어쓰기는 상관없어요.</p>`;
  card.className = "card result";
  card.innerHTML = `${stamp}<h2>${esc(q)}</h2>${how}${list}<a class="go-site" href="${SEARCH + encodeURIComponent(r.title)}" target="_blank" rel="noopener">사이트에서 직접 보기</a>`;
}

// 앱스 스크립트 화면은 iframe 안이라 clipboard API가 막힐 때가 있어서 예전 방식(execCommand)으로 한 번 더 시도
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const t = document.createElement("textarea");
  t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
  document.body.append(t); t.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
  t.remove(); return ok;
}

$("out").addEventListener("click", e => {
  const b = e.target.closest(".neis"); if (!b) return;
  const tag = b.querySelector(".tag");
  copyText(b.dataset.copy).then(ok => {
    if (!ok) { getSelection().selectAllChildren(b.querySelector(".txt")); tag.textContent = "Ctrl+C를 눌러 복사하세요"; return; }
    document.querySelectorAll(".neis.copied").forEach(x => { x.classList.remove("copied"); x.querySelector(".tag").textContent = "나이스용 복사"; });
    b.classList.add("copied"); tag.textContent = "복사했어요. 나이스에 붙여넣으세요";
  });
});

let running = false;
async function go() {
  const lines = $("q").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (running) return;
  if (!lines.length) { $("q").focus(); return; }
  running = true; $("go").disabled = true; $("out").innerHTML = "";
  const cards = lines.map(q => {
    const d = document.createElement("article"); d.className = "card result pending";
    d.innerHTML = `<span class="wait">기다리는 중</span><h2>${esc(q)}</h2>`;
    $("out").append(d); return d;
  });
  let done = 0;
  for (let i = 0; i < lines.length; i++) {   // 사이트에 부담 주지 않게 한 권씩
    cards[i].querySelector(".wait").textContent = "찾는 중…";
    $("status").textContent = `${lines.length}권 중 ${i + 1}번째 찾는 중`;
    try {
      render(cards[i], lines[i], await lookup(lines[i]));
      done++;
    } catch (e) {
      cards[i].className = "card result";
      cards[i].querySelector(".wait").outerHTML = `<div class="stamp warn">다시 시도<small>연결 오류</small></div>`;
      cards[i].insertAdjacentHTML("beforeend", `<p class="empty">${esc(e?.message || "사이트에 연결하지 못했어요. 찾기를 다시 눌러 주세요.")}</p>`);
    }
  }
  $("status").textContent = (done === lines.length ? `${lines.length}권 모두 찾았어요.` : `${lines.length}권 중 ${done}권을 찾았어요.`)
    + " 맞는 책의 ‘제목(저자)’ 버튼을 누르면 나이스에 넣을 글자가 복사돼요.";
  running = false; $("go").disabled = false;
}

$("go").onclick = go;
// Enter = 찾기, Shift+Enter = 줄바꿈. 줄바꿈 직전 이벤트(beforeinput)에서 막아서 한글 조합 중에도 글자가 잘리지 않음.
let shift = false;
$("q").addEventListener("keydown", e => { shift = e.shiftKey; });
$("q").addEventListener("beforeinput", e => {
  if ((e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") && !shift) { e.preventDefault(); go(); }
});
</script>
</body>
</html>
